<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex,nofollow">
<title>OrcaTerm2API · 控制台</title>
<link rel="stylesheet" href="assets/style.css">
<script>
  // 首屏前置应用主题，避免深浅色闪烁
  (function () {
    try {
      var t = localStorage.getItem('orca-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* 隐私模式下忽略 */ }
  })();
</script>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></symbol>
  <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01M10 7h4M10 17h4"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>

<!-- 启动占位 -->
<div id="boot-view" class="boot-view">
  <span class="spinner"></span>
  <span>正在连接控制台…</span>
</div>

<!-- 登录页 -->
<div id="login-view" class="login-view" hidden>
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-logo"><svg class="icon"><use href="#i-terminal"></use></svg></span>
      <span class="brand-word"><strong>OrcaTerm2API</strong><small>OPERATIONS CONSOLE</small></span>
    </div>
    <h1>登录控制台</h1>
    <p class="login-sub">输入面板密码，管理账号池、模型路由与网关配置。</p>
    <form id="login-form" class="login-form" novalidate>
      <label class="field-label" for="login-password">面板密码</label>
      <div class="password-wrap">
        <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入面板密码" required>
        <button type="button" id="password-eye" class="icon-btn" aria-label="显示密码">
          <svg class="icon"><use href="#i-eye"></use></svg>
        </button>
      </div>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button type="submit" id="login-submit" class="btn btn-primary btn-block">进入控制台</button>
    </form>
    <div class="login-foot"><span class="dot-live"></span><span>本地运维面板 · 登录凭据仅保存在服务端</span></div>
  </div>
</div>

<!-- 主界面 -->
<div id="main-view" class="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo"><svg class="icon"><use href="#i-terminal"></use></svg></span>
      <span class="brand-word"><strong>OrcaTerm2API</strong><small>OPERATIONS CONSOLE</small></span>
    </div>
    <nav class="nav" aria-label="主导航">
      <button class="nav-item" data-view="overview" type="button">
        <svg class="icon"><use href="#i-overview"></use></svg><span>概览</span>
      </button>
      <button class="nav-item" data-view="accounts" type="button">
        <svg class="icon"><use href="#i-users"></use></svg><span>账号</span>
      </button>
      <button class="nav-item" data-view="models" type="button">
        <svg class="icon"><use href="#i-cpu"></use></svg><span>模型</span>
      </button>
      <button class="nav-item" data-view="logs" type="button">
        <svg class="icon"><use href="#i-list"></use></svg><span>日志</span>
      </button>
      <button class="nav-item" data-view="settings" type="button">
        <svg class="icon"><use href="#i-settings"></use></svg><span>设置</span>
      </button>
    </nav>
    <div class="side-foot">
      <button id="theme-toggle" class="side-btn" type="button">
        <svg class="icon"><use href="#i-sun"></use></svg><span>浅色模式</span>
      </button>
      <button id="logout-btn" class="side-btn" type="button">
        <svg class="icon"><use href="#i-logout"></use></svg><span>退出登录</span>
      </button>
      <div class="side-version"><span class="dot-live"></span><span class="mono">v<span id="side-version">—</span></span></div>
    </div>
  </aside>
  <div class="main">
    <main id="content" class="content" tabindex="-1"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

<script src="assets/app.js"></script>
</body>
</html>
