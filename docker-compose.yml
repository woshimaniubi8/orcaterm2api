services:
  orcaterm2api:
    build: .
    image: orcaterm2api:latest
    container_name: orcaterm2api
    restart: unless-stopped
    ports:
      - "7864:7864"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7864/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
